<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI CORE // NEURAL SUBSTRATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#04070A;
    --cyan:#4FF0D6;
    --pink:#FF5EA8;
    --white:#EAF7F5;
    --slate:#24343A;
    --dim:#54706F;
    --line:#0E1A1D;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; width:100%; height:100%; background:var(--void); color:var(--white);
    font-family:'Red Hat Mono','JetBrains Mono',monospace; overflow:hidden; }
  .disp{ font-family:'Archivo',sans-serif; font-weight:700; letter-spacing:0.16em; transform:scaleX(1.12); transform-origin:left; }
  #viewport{ position:fixed; left:0; right:0; top:0; bottom:132px; }
  #viewport canvas{ display:block; width:100%; height:100%; position:absolute; inset:0; }
  #radial-canvas{ pointer-events:none; }

  #topbar{ position:fixed; top:0; left:0; right:0; height:44px; z-index:5; display:flex; align-items:center; justify-content:space-between; padding:0 20px;
    background:linear-gradient(180deg, rgba(4,7,10,0.94), rgba(4,7,10,0.2)); border-bottom:1px solid var(--line); }
  #topbar .id{ font-family:'Archivo',sans-serif; font-weight:700; font-size:16px; letter-spacing:0.2em; color:var(--cyan); transform:scaleX(1.15); transform-origin:left; }
  #topbar .sub{ font-size:11px; color:var(--dim); letter-spacing:0.12em; margin-left:22px; }
  #topbar .mode{ font-size:11px; display:flex; align-items:center; gap:8px; color:var(--dim); }
  #topbar .dot{ width:7px; height:7px; border-radius:50%; background:var(--dim); }
  #topbar .dot.live{ background:var(--cyan); box-shadow:0 0 6px var(--cyan); }
  #topbar .dot.synth{ background:var(--pink); box-shadow:0 0 6px var(--pink); }

  /* process log */
  #proclog{ position:fixed; left:0; right:0; bottom:0; z-index:5; width:auto; height:132px;
    background:rgba(4,7,10,0.88); border-top:1px solid var(--line); border-left:2px solid var(--cyan); padding:10px 14px; overflow:hidden; display:grid; grid-template-columns:180px 1fr; gap:12px; }
  #proclog h2{ margin:0; font-family:'Archivo',sans-serif; font-size:10px; letter-spacing:0.18em; color:var(--dim); font-weight:700; }
  .plog{ font-size:10px; line-height:1.55; color:var(--dim); column-count:3; column-gap:18px; }
  .plog .row b{ color:var(--cyan); }
  .plog .row.think b{ color:var(--pink); }

  .float-controls{ position:fixed; bottom:14px; right:14px; z-index:6; background:rgba(4,7,10,0.85); border:1px solid var(--line); padding:10px 12px; display:flex; flex-direction:column; gap:8px; min-width:200px; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; font-size:10px; letter-spacing:0.06em; color:var(--dim); }
  .toggle-row label{ font-family:'Red Hat Mono',monospace; text-transform:uppercase; letter-spacing:0.06em; }
  .switch{ width:34px; height:16px; background:var(--void); border:1px solid var(--line); position:relative; cursor:pointer; flex:none; }
  .switch .knob{ position:absolute; top:1px; left:1px; width:12px; height:12px; background:var(--dim); transition:all .15s ease; }
  .switch.on{ border-color:var(--cyan); }
  .switch.on .knob{ left:19px; background:var(--cyan); box-shadow:0 0 5px var(--cyan); }

  #boot-overlay{ position:fixed; inset:0; background:var(--void); z-index:50; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
  #boot-overlay .title{ font-family:'Archivo',sans-serif; font-weight:700; color:var(--cyan); font-size:22px; letter-spacing:0.16em; }
  #boot-overlay p{ color:var(--dim); font-size:12px; max-width:390px; text-align:center; line-height:1.6; }
  #boot-btn{ font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.12em; background:transparent; border:1px solid var(--cyan); color:var(--cyan); padding:14px 34px; cursor:pointer; }
  #boot-btn:hover{ background:var(--cyan); color:var(--void); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="boot-overlay">
  <div class="title">AI CORE</div>
  <p>Ship neural substrate. An audio start gesture is required to bring the core online. Detected transients seed activation cascades across the node graph.</p>
  <button id="boot-btn">Bring Core Online</button>
</div>

<div id="viewport">
  <canvas id="gl-canvas"></canvas>
  <canvas id="radial-canvas"></canvas>
</div>

<div id="topbar">
  <div style="display:flex;align-items:baseline;"><span class="id">AI CORE</span><span class="sub">NEURAL SUBSTRATE · SUBSTRATE NOMINAL</span></div>
  <div class="mode"><span id="mode-dot" class="dot"></span><span id="mode-text">STANDBY</span></div>
</div>

<div id="proclog"><h2>PROCESS LOG</h2><div class="plog" id="plog-rows"></div></div>

<div class="float-controls">
  <div class="toggle-row"><label>3D Spatial Audio</label><div class="switch on" id="toggle-spatial"><div class="knob"></div></div></div>
  <div class="toggle-row"><label>Thought Blips</label><div class="switch on" id="toggle-standard"><div class="knob"></div></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../shared/audio-engine.js"></script>
<script src="../shared/embed.js"></script>
<script>
(function(){
  'use strict';
  const engine = new ShipAudioEngine({ fftSize: 2048, smoothing: 0.7 });
  let spatialEnabled=true, standardEnabled=true;
  const soundCfg = { blipPitch:1, blipGain:1, blipGap:0.08, voiceGain:1, cascadeDepth:3, triggerSensitivity:0.25 };
  function clamp(v,min,max){ return Math.max(min, Math.min(max, Number(v))); }
  window.__shipPanelConfig = function(cfg){
    if(!cfg) return;
    if(cfg.blipPitch != null) soundCfg.blipPitch = clamp(cfg.blipPitch, 0.35, 2.8);
    if(cfg.blipGain != null) soundCfg.blipGain = clamp(cfg.blipGain, 0, 1.6);
    if(cfg.blipGap != null) soundCfg.blipGap = clamp(cfg.blipGap, 0.02, 0.35);
    if(cfg.voiceGain != null) soundCfg.voiceGain = clamp(cfg.voiceGain, 0, 1.5);
    if(cfg.cascadeDepth != null) soundCfg.cascadeDepth = Math.round(clamp(cfg.cascadeDepth, 1, 5));
    if(cfg.triggerSensitivity != null) soundCfg.triggerSensitivity = clamp(cfg.triggerSensitivity, 0.1, 0.8);
  };
  document.getElementById('toggle-spatial').addEventListener('click', function(){ spatialEnabled=!spatialEnabled; this.classList.toggle('on',spatialEnabled); });
  document.getElementById('toggle-standard').addEventListener('click', function(){ standardEnabled=!standardEnabled; this.classList.toggle('on',standardEnabled); });
  document.getElementById('boot-btn').addEventListener('click', async function(){
    this.disabled=true; this.textContent='Booting…';
    const mode=await engine.start();
    document.getElementById('boot-overlay').classList.add('hidden');
    const dot=document.getElementById('mode-dot'), txt=document.getElementById('mode-text');
    if(mode==='mic'){ dot.classList.add('live'); txt.textContent='LIVE MIC'; } else { dot.classList.add('synth'); txt.textContent='SYNTH FEED'; }
    startAll();
  });

  // ---------- Three.js neural graph ----------
  const vpEl=document.getElementById('viewport');
  const glCanvas=document.getElementById('gl-canvas');
  const renderer=new THREE.WebGLRenderer({ canvas:glCanvas, antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setClearColor(0x04070A,1);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(55,1,0.1,100); camera.position.set(0,0,9);
  scene.add(new THREE.AmbientLight(0x223333,1.5));

  const N=180;
  const nodes=[];
  const nodePos=new Float32Array(N*3);
  const nodeCol=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    // loose spherical cluster
    const r=2.2+Math.random()*1.6, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    const x=r*Math.sin(ph)*Math.cos(th), y=r*Math.sin(ph)*Math.sin(th), z=r*Math.cos(ph);
    nodePos[i*3]=x; nodePos[i*3+1]=y; nodePos[i*3+2]=z;
    // pitch from position hash
    const hash=Math.abs(Math.sin((x*12.9898+y*78.233+z*37.719))*43758.5453);
    const freq=180 + (hash%1)*640;
    nodes.push({ x,y,z, level:0, freq, nbrs:[] });
  }
  // k-nearest edges
  const edgePts=[];
  for(let i=0;i<N;i++){
    const dists=[];
    for(let j=0;j<N;j++){ if(i===j) continue; const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, dz=nodes[i].z-nodes[j].z; dists.push([dx*dx+dy*dy+dz*dz, j]); }
    dists.sort((a,b)=>a[0]-b[0]);
    for(let k=0;k<3;k++){ const j=dists[k][1]; nodes[i].nbrs.push(j); if(i<j){ edgePts.push(new THREE.Vector3(nodes[i].x,nodes[i].y,nodes[i].z), new THREE.Vector3(nodes[j].x,nodes[j].y,nodes[j].z)); } }
  }
  const nodeGeo=new THREE.BufferGeometry();
  nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePos,3));
  nodeGeo.setAttribute('color', new THREE.BufferAttribute(nodeCol,3));
  const nodePoints=new THREE.Points(nodeGeo, new THREE.PointsMaterial({ size:0.13, vertexColors:true, transparent:true, opacity:0.95 }));
  scene.add(nodePoints);
  const edges=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(edgePts), new THREE.LineBasicMaterial({ color:0x1c464a, transparent:true, opacity:0.35 }));
  scene.add(edges);
  const graph=new THREE.Group(); scene.add(graph); graph.add(nodePoints); graph.add(edges);

  // ---------- 3D core (center ball) ----------
  const core=new THREE.Group(); scene.add(core);
  const coreBallMat=new THREE.MeshBasicMaterial({ color:0x4FF0D6, transparent:true, opacity:0.85 });
  const coreBall=new THREE.Mesh(new THREE.SphereGeometry(0.5,28,28), coreBallMat);
  const coreGlowMat=new THREE.MeshBasicMaterial({ color:0x4FF0D6, transparent:true, opacity:0.16, blending:THREE.AdditiveBlending, depthWrite:false });
  const coreGlow=new THREE.Mesh(new THREE.SphereGeometry(0.9,22,22), coreGlowMat);
  const coreCageMat=new THREE.MeshBasicMaterial({ color:0xFF5EA8, wireframe:true, transparent:true, opacity:0.4 });
  const coreCage=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,1), coreCageMat);
  core.add(coreGlow); core.add(coreBall); core.add(coreCage);
  let coreFlash=0;

  function resize(){ const w=vpEl.clientWidth,h=vpEl.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix(); radialCanvas.width=w; radialCanvas.height=h; }
  window.addEventListener('resize', resize);

  // ---------- radial spectrograph overlay ----------
  const radialCanvas=document.getElementById('radial-canvas'); const rCtx=radialCanvas.getContext('2d');
  function drawRadial(freq){
    const w=radialCanvas.width,h=radialCanvas.height; if(!w||!h) return;
    rCtx.clearRect(0,0,w,h);
    const cx=w/2, cy=h/2, inner=Math.min(w,h)*0.10, maxLen=Math.min(w,h)*0.34;
    const SPOKES=128;
    for(let i=0;i<SPOKES;i++){
      const idx=Math.floor(i/SPOKES*freq.length*0.55); const v=freq[idx]/255;
      const a=i/SPOKES*Math.PI*2 - Math.PI/2;
      const r0=inner, r1=inner+v*maxLen;
      const x0=cx+Math.cos(a)*r0, y0=cy+Math.sin(a)*r0, x1=cx+Math.cos(a)*r1, y1=cy+Math.sin(a)*r1;
      rCtx.strokeStyle=`rgba(${79+120*v|0},${240-90*v|0},${214-40*v|0},${0.25+v*0.7})`;
      rCtx.lineWidth=1.4; rCtx.beginPath(); rCtx.moveTo(x0,y0); rCtx.lineTo(x1,y1); rCtx.stroke();
    }
    // (center glow is now the real 3D core sphere, drawn on the GL canvas)
  }

  // ---------- process log ----------
  const plogRows=document.getElementById('plog-rows'); const plogBuf=[];
  const MSGS=['inference pass complete','memory consolidation','attention head realigned','gradient checkpoint saved','sensor fusion updated','path planner nominal','context window pruned'];
  function pushLog(msg, cls){ const ts=new Date().toISOString().substr(11,8); plogBuf.unshift(`<div class="row ${cls||''}"><b>${ts}</b> ${msg}</div>`); if(plogBuf.length>16) plogBuf.pop(); plogRows.innerHTML=plogBuf.join(''); }
  setInterval(()=>{ if(running) pushLog(MSGS[Math.floor(Math.random()*MSGS.length)]); }, 2200);

  // ---------- transient detection + cascade ----------
  let prevFreq=null, fluxAvg=0;
  function detectTransient(freq){
    if(!prevFreq) prevFreq=new Float32Array(freq.length);
    let flux=0; for(let i=0;i<freq.length;i++){ const d=freq[i]-prevFreq[i]; if(d>0) flux+=d; prevFreq[i]=freq[i]; }
    flux/=freq.length; fluxAvg+=(flux-fluxAvg)*0.05;
    return flux>fluxAvg*1.8+3;
  }
  let lastBlip=0;
  function fireNode(i, intensity, depth, time){
    const nd=nodes[i]; nd.level=Math.max(nd.level, intensity);
    // thought blip (throttled), pitch from position hash
    if(depth===0 && standardEnabled && time-lastBlip>soundCfg.blipGap){ lastBlip=time; engine.pingStandard({ freq:nd.freq*soundCfg.blipPitch, pan:nd.x/4, duration:0.14, type:'sine', gain:(0.14+intensity*0.12)*soundCfg.blipGain }); }
    if(depth===0 && spatialEnabled){
      const v=engine.createSpatialVoice({ freq:nd.freq*soundCfg.blipPitch, type:'sine' });
      v.setPosition(nd.x, nd.y, nd.z); v.setGain(0.35*soundCfg.voiceGain);
      // pan from source node toward the listener (origin) over its brief life
      let step=0; const iv=setInterval(()=>{ step+=0.2; v.setPosition(nd.x*(1-step), nd.y*(1-step), nd.z*(1-step)); if(step>=1){ clearInterval(iv); v.stop(0.08); } }, 40);
    }
    if(depth<soundCfg.cascadeDepth && intensity>soundCfg.triggerSensitivity){
      nd.nbrs.forEach(j=>{ setTimeout(()=>{ if(running) fireNode(j, intensity*0.6, depth+1, performance.now()*0.001); }, 70+Math.random()*60); });
    }
  }

  // ---------- loop ----------
  let running=false;
  let coreVoice=null; // persistent 3D "core hum" that orbits the listener
  function startAll(){
    resize(); running=true;
    coreVoice=engine.createSpatialVoice({ freq:72, type:'sine' }); coreVoice.setGain(0);
    pushLog('neural substrate online','think');
    requestAnimationFrame(loop);
  }

  function loop(t){
    if(!running) return; requestAnimationFrame(loop);
    const time=t*0.001;
    const freq=engine.getFrequencyData();

    if(detectTransient(freq)){
      const seed=Math.floor(Math.random()*N);
      fireNode(seed, 1, 0, time);
      coreFlash=1;
      if(Math.random()<0.3) pushLog('cascade @ node '+String(seed).padStart(3,'0'),'think');
    }

    // update node colors from levels
    const col=nodeGeo.attributes.color.array;
    for(let i=0;i<N;i++){
      const nd=nodes[i]; nd.level*=0.92;
      const l=nd.level;
      // base dim cyan -> bright pink when active
      col[i*3]  =0.12 + l*0.88;      // r
      col[i*3+1]=0.5 + l*0.37;       // g
      col[i*3+2]=0.45 + l*0.2;       // b
    }
    nodeGeo.attributes.color.needsUpdate=true;

    graph.rotation.y+=0.0016; graph.rotation.x=Math.sin(time*0.1)*0.15;

    // 3D core: pulse the ball with overall level, flash pink on cascades
    const level=engine.getLevel();
    coreFlash*=0.9;
    const pulse=1 + level*0.45 + coreFlash*0.35;
    coreBall.scale.setScalar(pulse);
    coreGlow.scale.setScalar(pulse*1.04 + coreFlash*0.5);
    coreBallMat.opacity=0.7 + level*0.3;
    coreGlowMat.opacity=0.12 + level*0.3 + coreFlash*0.35;
    coreBallMat.color.setRGB(0.31 + coreFlash*0.69, 0.94 - coreFlash*0.5, 0.84 - coreFlash*0.15);
    coreCage.rotation.y+=0.004; coreCage.rotation.x+=0.0022;
    coreCageMat.opacity=0.3 + level*0.35;
    // 3D core hum: orbit a low spatial voice around the listener at the origin
    if(coreVoice){
      if(spatialEnabled){ const a=time*0.55; coreVoice.setPosition(Math.cos(a)*1.7, Math.sin(a*0.8)*0.9, Math.sin(a)*1.7); coreVoice.setGain((0.09 + level*0.5)*soundCfg.voiceGain, 0.12); }
      else coreVoice.setGain(0, 0.15);
    }

    renderer.render(scene,camera);
    drawRadial(freq);
  }
})();
</script>
</body>
</html>
