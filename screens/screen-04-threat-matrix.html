<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THREAT MATRIX // TACTICAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#060505;
    --red:#FF3B30;
    --white:#F5F5F0;
    --amber:#FFB020;
    --grid:#3A2323;
    --dim:#8A6A6A;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; width:100%; height:100%; background:var(--void); color:var(--white);
    font-family:'Roboto Mono',monospace; overflow:hidden; }
  .disp{ font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; }
  #app{ position:fixed; inset:0; display:grid; grid-template-columns:1fr 250px; grid-template-rows:48px 1fr 92px; gap:1px; background:var(--grid); padding:1px; }
  .panel{ background:#0B0808; position:relative; overflow:hidden; }
  #topbar{ grid-column:1/span 2; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:linear-gradient(180deg,#140A0A,#0B0707); border-bottom:1px solid var(--grid); }
  #topbar .id{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; letter-spacing:0.18em; color:var(--red); }
  #topbar .sub{ font-size:11px; color:var(--dim); letter-spacing:0.12em; margin-left:10px; }
  #topbar .mode{ font-size:11px; display:flex; align-items:center; gap:8px; }
  #topbar .dot{ width:7px; height:7px; border-radius:50%; background:var(--dim); }
  #topbar .dot.live{ background:var(--amber); box-shadow:0 0 6px var(--amber); }
  #topbar .dot.synth{ background:var(--red); box-shadow:0 0 6px var(--red); }

  #radar{ grid-column:1; grid-row:2; }
  #radar canvas{ display:block; width:100%; height:100%; }
  #radar .vp-label{ position:absolute; top:12px; left:16px; font-size:11px; color:var(--dim); letter-spacing:0.16em; z-index:2; }
  #radar .vp-label b{ color:var(--red); }

  #roster{ grid-column:2; grid-row:2; padding:14px 14px; overflow:hidden; }
  #roster h2{ margin:0 0 10px; font-family:'Rajdhani',sans-serif; font-size:12px; letter-spacing:0.18em; color:var(--dim); }
  .tgt{ margin-bottom:9px; font-size:10.5px; letter-spacing:0.04em; border-left:2px solid var(--grid); padding-left:8px; }
  .tgt.locked{ border-left-color:var(--red); }
  .tgt .name{ color:var(--white); font-weight:500; }
  .tgt .name.locked{ color:var(--red); }
  .tgt .stat{ color:var(--dim); }
  #sig{ margin-top:14px; }
  #sig .lbl{ font-size:10px; color:var(--dim); letter-spacing:0.15em; margin-bottom:4px; }
  #sig canvas{ width:100%; height:56px; display:block; background:#0B0808; border:1px solid var(--grid); }

  #threatbar{ grid-column:1/span 2; grid-row:3; padding:10px 18px; }
  #threatbar .lbl{ font-size:10px; color:var(--dim); letter-spacing:0.15em; margin-bottom:6px; }
  #threatbar canvas{ display:block; width:100%; height:44px; }

  .float-controls{ position:fixed; bottom:14px; right:14px; z-index:6; background:rgba(6,5,5,0.85); border:1px solid var(--grid); padding:10px 12px; display:flex; flex-direction:column; gap:8px; min-width:190px; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; font-size:10px; letter-spacing:0.08em; color:var(--dim); }
  .toggle-row label{ font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; }
  .switch{ width:34px; height:16px; background:var(--void); border:1px solid var(--grid); position:relative; cursor:pointer; flex:none; }
  .switch .knob{ position:absolute; top:1px; left:1px; width:12px; height:12px; background:var(--dim); transition:all .15s ease; }
  .switch.on{ border-color:var(--amber); }
  .switch.on .knob{ left:19px; background:var(--amber); box-shadow:0 0 5px var(--amber); }

  #boot-overlay{ position:fixed; inset:0; background:var(--void); z-index:50; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
  #boot-overlay .title{ font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--red); font-size:26px; letter-spacing:0.2em; }
  #boot-overlay p{ color:var(--dim); font-size:12px; letter-spacing:0.06em; max-width:380px; text-align:center; line-height:1.6; }
  #boot-btn{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; letter-spacing:0.16em; text-transform:uppercase; background:transparent; border:1px solid var(--red); color:var(--red); padding:14px 34px; cursor:pointer; }
  #boot-btn:hover{ background:var(--red); color:var(--void); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="boot-overlay">
  <div class="title">Threat Matrix</div>
  <p>Tactical targeting radar. An audio start gesture is required to power the sweep array. Contacts illuminate only as the sweep crosses them.</p>
  <button id="boot-btn">Power Array</button>
</div>

<div id="app">
  <div id="topbar" class="panel">
    <div style="display:flex;align-items:baseline;"><span class="id">Threat Matrix</span><span class="sub">TAC-RDR · SWEEP ACTIVE</span></div>
    <div class="mode"><span id="mode-dot" class="dot"></span><span id="mode-text">STANDBY</span></div>
  </div>
  <div id="radar" class="panel"><div class="vp-label">SWEEP RADAR &nbsp;<b>·</b>&nbsp; 360° TACTICAL</div></div>
  <div id="roster" class="panel">
    <h2>TARGET ROSTER</h2>
    <div id="tgt-list"></div>
    <div id="sig"><div class="lbl">SIGNATURE ANALYSIS · LOCKED</div><canvas id="sig-canvas"></canvas></div>
  </div>
  <div id="threatbar" class="panel"><div class="lbl">THREAT LEVEL</div><canvas id="threat-canvas"></canvas></div>
</div>

<div class="float-controls">
  <div class="toggle-row"><label>Hostile Drones (3D)</label><div class="switch on" id="toggle-spatial"><div class="knob"></div></div></div>
  <div class="toggle-row"><label>Sweep Ping</label><div class="switch on" id="toggle-standard"><div class="knob"></div></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../shared/audio-engine.js"></script>
<script src="../shared/embed.js"></script>
<script>
(function(){
  'use strict';
  const engine = new ShipAudioEngine({ fftSize: 2048, smoothing: 0.75 });
  let spatialEnabled=true, standardEnabled=true;
  document.getElementById('toggle-spatial').addEventListener('click', function(){ spatialEnabled=!spatialEnabled; this.classList.toggle('on',spatialEnabled); });
  document.getElementById('toggle-standard').addEventListener('click', function(){ standardEnabled=!standardEnabled; this.classList.toggle('on',standardEnabled); });
  document.getElementById('boot-btn').addEventListener('click', async function(){
    this.disabled=true; this.textContent='Powering…';
    const mode=await engine.start();
    document.getElementById('boot-overlay').classList.add('hidden');
    const dot=document.getElementById('mode-dot'), txt=document.getElementById('mode-text');
    if(mode==='mic'){ dot.classList.add('live'); txt.textContent='LIVE MIC'; } else { dot.classList.add('synth'); txt.textContent='SYNTH FEED'; }
    startAll();
  });

  // ---------- Three.js radar ----------
  const radarEl=document.getElementById('radar');
  const renderer=new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  radarEl.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(46,1,0.1,100); camera.position.set(0,7.5,6.5); camera.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight(0x442222,1.4));

  // radar plane rings + spokes
  for(let r=1.6;r<=6;r+=1.6){
    const ring=new THREE.Mesh(new THREE.RingGeometry(r-0.02,r,72), new THREE.MeshBasicMaterial({ color:0x3A2323, side:THREE.DoubleSide, transparent:true, opacity:0.7 }));
    ring.rotation.x=Math.PI/2; scene.add(ring);
  }
  for(let a=0;a<8;a++){ const ang=a/8*Math.PI*2; const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(Math.cos(ang)*6,0,Math.sin(ang)*6)]); scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color:0x3A2323, transparent:true, opacity:0.5 }))); }

  // sweep wedge + trailing copies for fade
  const TRAIL=8; const sweepMeshes=[];
  for(let i=0;i<TRAIL;i++){
    const wedge=new THREE.Mesh(new THREE.RingGeometry(0.1,6,24,1,0,0.32), new THREE.MeshBasicMaterial({ color:0xFF3B30, side:THREE.DoubleSide, transparent:true, opacity:0.28*(1-i/TRAIL) }));
    wedge.rotation.x=Math.PI/2; scene.add(wedge); sweepMeshes.push(wedge);
  }

  // targets
  const NAMES=['BOGEY-1','BOGEY-2','BOGEY-3','BOGEY-4','BOGEY-5'];
  const targets=[];
  for(let i=0;i<5;i++){
    const bearing=Math.random()*Math.PI*2; const radius=2+Math.random()*3.6;
    const blip=new THREE.Mesh(new THREE.TetrahedronGeometry(0.24), new THREE.MeshBasicMaterial({ color:0xFF3B30, transparent:true, opacity:0.15 }));
    blip.position.set(Math.cos(bearing)*radius,0.05,Math.sin(bearing)*radius); scene.add(blip);
    targets.push({ name:NAMES[i], bearing, radius, blip, flash:0, binLo:Math.floor(20+i*90), binHi:Math.floor(20+(i+1)*90), threat:0.2+Math.random()*0.5, baseFreq:200+i*80, drone:null, lastPing:0 });
  }
  // lock-on brackets (four small lines) around locked target
  const bracketMat=new THREE.LineBasicMaterial({ color:0xFFB020 });
  const bracket=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(new Array(16).fill(0).map(()=>new THREE.Vector3())), bracketMat);
  scene.add(bracket);

  function resizeRadar(){ const w=radarEl.clientWidth,h=radarEl.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resizeRadar);

  // ---------- signature + threat canvases ----------
  const sigCanvas=document.getElementById('sig-canvas'); const sigCtx=sigCanvas.getContext('2d');
  const thCanvas=document.getElementById('threat-canvas'); const thCtx=thCanvas.getContext('2d');
  function sizeCanvas(c){ c.width=c.clientWidth; c.height=c.clientHeight; }
  window.addEventListener('resize', ()=>{ sizeCanvas(sigCanvas); sizeCanvas(thCanvas); });

  const listEl=document.getElementById('tgt-list');

  // ---------- loop ----------
  let running=false, sweepAng=0, prevSweep=0, lockedIdx=0;
  function startAll(){ resizeRadar(); sizeCanvas(sigCanvas); sizeCanvas(thCanvas); running=true; requestAnimationFrame(loop); }

  function crossed(a, prev, cur){ // did sweep angle cross target bearing between prev and cur (mod 2pi)
    const norm=x=>((x%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    a=norm(a); let p=norm(prev), c=norm(cur);
    if(c<p) c+=Math.PI*2;
    if(a<p) a+=Math.PI*2;
    return a>=p && a<=c;
  }

  function loop(t){
    if(!running) return; requestAnimationFrame(loop);
    const time=t*0.001;
    const freq=engine.getFrequencyData();
    prevSweep=sweepAng; sweepAng+=0.028;
    // sweep trail
    for(let i=0;i<TRAIL;i++){ sweepMeshes[i].rotation.z=-(sweepAng - i*0.10); }

    // lock strongest-threat target
    let maxThreat=-1;
    targets.forEach((tg,i)=>{ let s=0,c=0; for(let b=tg.binLo;b<tg.binHi;b++){ s+=freq[b]; c++; } const amp=c?s/c/255:0; tg.threat+= ((0.2+amp*0.8)-tg.threat)*0.05; if(tg.threat>maxThreat){ maxThreat=tg.threat; lockedIdx=i; } });

    let html='';
    targets.forEach((tg,i)=>{
      // deterministic ping exactly when sweep crosses bearing
      if(crossed(tg.bearing, prevSweep, sweepAng)){
        tg.flash=1;
        if(standardEnabled && time-tg.lastPing>0.15){ tg.lastPing=time; const pan=Math.cos(tg.bearing); engine.pingStandard({ freq:520+tg.threat*300, pan, duration:0.14, type:'sine', gain:0.3 }); }
        if(spatialEnabled && tg.drone) tg.drone.setGain(0.5); // swell as sweep passes
      }
      tg.flash*=0.94;
      tg.blip.material.opacity=0.15+tg.flash*0.85;
      tg.blip.scale.setScalar(1+tg.flash*1.4);
      tg.blip.rotation.y+=0.05; tg.blip.rotation.x+=0.03;

      // ambient hostile drone at bearing, quiet baseline
      if(spatialEnabled){ if(!tg.drone){ tg.drone=engine.createSpatialVoice({ freq:tg.baseFreq, type:'sawtooth' }); tg.drone.setPosition(Math.cos(tg.bearing)*tg.radius, 0, Math.sin(tg.bearing)*tg.radius); } tg.drone.setGain(0.05+tg.flash*0.4); }
      else if(tg.drone){ tg.drone.stop(); tg.drone=null; }

      const locked=i===lockedIdx;
      const brg=((tg.bearing*180/Math.PI)%360).toFixed(0).padStart(3,'0');
      html+=`<div class="tgt ${locked?'locked':''}"><div class="name ${locked?'locked':''}">${tg.name}${locked?' ◄ LOCK':''}</div><div class="stat">BRG ${brg}° · RNG ${tg.radius.toFixed(1)} · THR ${(tg.threat*100).toFixed(0)}</div></div>`;
    });
    listEl.innerHTML=html;

    // lock brackets around locked target — four L-shaped corners
    const L=targets[lockedIdx]; const lp=L.blip.position; const s=0.45;
    const corners=[[-1,-1],[1,-1],[1,1],[-1,1]];
    const bpts=[];
    corners.forEach(c=>{ const cx=lp.x+c[0]*s, cz=lp.z+c[1]*s; bpts.push(new THREE.Vector3(cx,0.05,cz)); bpts.push(new THREE.Vector3(cx-c[0]*s*0.5,0.05,cz)); bpts.push(new THREE.Vector3(cx,0.05,cz)); bpts.push(new THREE.Vector3(cx,0.05,cz-c[1]*s*0.5)); });
    bracket.geometry.setFromPoints(bpts); bracket.material.opacity=1;

    // signature analysis of locked target's band
    drawSig(freq, L);
    drawThreat();

    renderer.render(scene,camera);
  }

  function drawSig(freq, tg){
    const w=sigCanvas.width,h=sigCanvas.height; if(!w||!h) return;
    sigCtx.clearRect(0,0,w,h); sigCtx.fillStyle='#FF3B30';
    const n=tg.binHi-tg.binLo;
    for(let x=0;x<w;x++){ const idx=tg.binLo+Math.floor(x/w*n); const v=freq[idx]/255; sigCtx.fillRect(x, h-v*h, 1, v*h); }
  }
  function drawThreat(){
    const w=thCanvas.width,h=thCanvas.height; if(!w||!h) return;
    thCtx.clearRect(0,0,w,h);
    const bw=w/targets.length;
    targets.forEach((tg,i)=>{ const bh=tg.threat*h; thCtx.fillStyle=tg.threat>0.7?'#FF3B30':(tg.threat>0.45?'#FFB020':'#8A6A6A'); thCtx.fillRect(i*bw+4, h-bh, bw-8, bh); thCtx.fillStyle='#8A6A6A'; thCtx.font='9px "Roboto Mono", monospace'; thCtx.fillText(tg.name, i*bw+4, h-2); });
  }
})();
</script>
</body>
</html>
